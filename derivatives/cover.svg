<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" width="1360" height="850">
<title>Cover: The Derivative That Saw It Coming</title>
<desc>Split cover with title panel on the left and three-trace chart on the right showing acceleration peaking before the value bends.</desc>

<defs>
  <marker id="arrEnd" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#8a8880"/>
  </marker>
  <marker id="arrStart" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M10 0L0 5L10 10z" fill="#8a8880"/>
  </marker>
</defs>

<!-- Background -->
<rect width="1360" height="850" fill="#0d0d0d"/>

<!-- ===== LEFT PANEL ===== -->

<!-- CodePuz badge -->
<rect x="70" y="70" width="150" height="42" rx="6" fill="#00b4d8"/>
<text x="145" y="97" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#0d0d0d">CODEPUZ</text>

<!-- Title -->
<text x="70" y="230" font-family="Georgia, Times New Roman, serif" font-size="78" font-weight="700" fill="#f4f0e8" letter-spacing="-1">The Derivative</text>
<text x="70" y="315" font-family="Georgia, Times New Roman, serif" font-size="78" font-weight="700" fill="#f4f0e8" letter-spacing="-1">That Saw It</text>
<text x="70" y="400" font-family="Georgia, Times New Roman, serif" font-size="78" font-weight="700" fill="#f4f0e8" letter-spacing="-1">Coming</text>

<!-- Subtitle formula -->
<text x="70" y="458" font-family="Georgia, Times New Roman, serif" font-size="28" font-style="italic" fill="#6a6860">f(x)  &#xB7;  f&#x2032;(x)  &#xB7;  f&#x2033;(x)</text>

<!-- Tagline -->
<text x="70" y="540" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" fill="#00b4d8">The signal that arrives</text>
<text x="70" y="578" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700" fill="#00b4d8">before the number does.</text>

<!-- Divider line -->
<line x1="70" y1="608" x2="540" y2="608" stroke="#00b4d8" stroke-width="0.5" opacity="0.5"/>

<!-- Description -->
<text x="70" y="648" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="18" fill="#8a8880">How the second derivative sees a trend</text>
<text x="70" y="674" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="18" fill="#8a8880">turning before the value on the chart</text>
<text x="70" y="700" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="18" fill="#8a8880">has caught up.</text>

<!-- URL -->
<text x="70" y="800" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="14" fill="#4a4846" letter-spacing="0.5">codepuz.com</text>

<!-- ===== DIVIDER ===== -->
<line x1="640" y1="60" x2="640" y2="790" stroke="#2a2a28" stroke-width="1"/>

<!-- ===== RIGHT PANEL: chart ===== -->

<!-- Chart axes (drawn first, text layered on top) -->
<!-- Y axis -->
<line x1="700" y1="90" x2="700" y2="730" stroke="#3a3a38" stroke-width="1"/>
<path d="M700 90 L696 102 L704 102 Z" fill="#3a3a38"/>
<!-- X axis -->
<line x1="700" y1="730" x2="1300" y2="730" stroke="#3a3a38" stroke-width="1"/>
<!-- Grid lines -->
<line x1="700" y1="210" x2="1300" y2="210" stroke="#1e1e1c" stroke-width="0.5"/>
<line x1="700" y1="340" x2="1300" y2="340" stroke="#1e1e1c" stroke-width="0.5"/>
<line x1="700" y1="470" x2="1300" y2="470" stroke="#1e1e1c" stroke-width="0.5"/>
<line x1="700" y1="600" x2="1300" y2="600" stroke="#1e1e1c" stroke-width="0.5"/>

<!-- "signal" y-axis label -->
<text x="694" y="415" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif" font-size="12" fill="#4a4846" transform="rotate(-90,694,415)">signal</text>

<!-- Three curves -->

<!-- value f(x) - lavender/purple, steadily rising -->
<path d="M710 720 C900 718 1010 650 1120 500 C1200 390 1245 225 1290 145"
      fill="none" stroke="#9988cc" stroke-width="3" opacity="0.6" stroke-linecap="round"/>

<!-- rate f'(x) - gold, peaks in middle -->
<path d="M710 510 C820 505 1000 390 1120 500 C1200 570 1252 628 1290 648"
      fill="none" stroke="#d8a44e" stroke-width="3" opacity="0.75" stroke-linecap="round"/>

<!-- acceleration f''(x) - teal, peaks early (the tell) -->
<!-- glow layer -->
<path d="M710 510 C810 505 900 268 980 268 C1055 268 1155 668 1240 668 C1264 668 1278 662 1290 658"
      fill="none" stroke="#00b4d8" stroke-width="10" opacity="0.12" stroke-linecap="round"/>
<!-- main line -->
<path d="M710 510 C810 505 900 268 980 268 C1055 268 1155 668 1240 668 C1264 668 1278 662 1290 658"
      fill="none" stroke="#00b4d8" stroke-width="4" stroke-linecap="round"/>

<!-- Curve labels (drawn after lines so they sit on top) -->
<text x="1238" y="134" font-family="-apple-system, Helvetica, sans-serif" font-size="14" fill="#9988cc" opacity="0.9">f(x)</text>
<text x="1238" y="152" font-family="-apple-system, Helvetica, sans-serif" font-size="11" fill="#9988cc" opacity="0.7">value</text>

<text x="1238" y="664" font-family="-apple-system, Helvetica, sans-serif" font-size="14" fill="#d8a44e">f&#x2032;(x)</text>
<text x="1238" y="682" font-family="-apple-system, Helvetica, sans-serif" font-size="11" fill="#d8a44e" opacity="0.8">rate</text>

<!-- Dashed vertical: the tell (acceleration peaks here) -->
<line x1="980" y1="118" x2="980" y2="730" stroke="#00b4d8" stroke-width="1" stroke-dasharray="6,6" opacity="0.55"/>
<circle cx="980" cy="268" r="6" fill="#00b4d8"/>

<!-- Dashed vertical: the bend (value visibly changes here) -->
<line x1="1120" y1="118" x2="1120" y2="730" stroke="#9988cc" stroke-width="1" stroke-dasharray="6,6" opacity="0.5"/>
<circle cx="1120" cy="500" r="6" fill="#9988cc"/>

<!-- Gap bracket (drawn before labels so labels sit on top) -->
<line x1="992" y1="760" x2="1108" y2="760" stroke="#8a8880" stroke-width="1.5" marker-end="url(#arrEnd)" marker-start="url(#arrStart)"/>

<!-- Labels for markers and gap (drawn last so they cover lines) -->
<rect x="716" y="248" width="128" height="22" rx="2" fill="#0d0d0d"/>
<text x="718" y="264" font-family="-apple-system, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#00b4d8">acceleration  f&#x2033;(x)  &#x2191;</text>

<rect x="972" y="730" width="64" height="18" rx="2" fill="#0d0d0d"/>
<text x="974" y="744" font-family="-apple-system, Helvetica, sans-serif" font-size="13" fill="#00b4d8" opacity="0.9">the tell</text>

<rect x="1112" y="730" width="116" height="18" rx="2" fill="#0d0d0d"/>
<text x="1114" y="744" font-family="-apple-system, Helvetica, sans-serif" font-size="13" fill="#9988cc" opacity="0.85">the value bends</text>

<rect x="1002" y="766" width="96" height="18" rx="2" fill="#0d0d0d"/>
<text x="1050" y="780" text-anchor="middle" font-family="-apple-system, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#8a8880">saw it coming</text>

</svg>